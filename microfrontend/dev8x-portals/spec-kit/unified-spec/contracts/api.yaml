api_version: v1
domains:
  auth:
    - POST /auth/login
    - POST /auth/register
    - POST /auth/mfa/verify
    - POST /auth/password/reset
    - POST /auth/sso/google
  admin:
    - GET /admin/dashboard/kpis
    - GET /admin/dashboard/funnel
    - GET /admin/applicants
    - GET /admin/applicants/{id}
    - PATCH /admin/applicants/{id}/status
    - GET /admin/jobs
    - POST /admin/interviews/schedule
  candidate:
    - GET /candidate/timeline
    - POST /candidate/interviews/schedule
    - POST /candidate/documents/{id}/sign
  client:
    - GET /client/projects
    - GET /client/invoices
    - POST /client/files/upload
    - GET /client/time-entries
  crm:
    - GET /crm/contacts
    - GET /crm/deals
    - GET /crm/analytics/channels
