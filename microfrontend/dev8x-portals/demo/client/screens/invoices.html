<!-- SCREEN_START -->
<section class="surface-stack">
  <header class="surface-header">
    <div class="surface-header__content">
      <div class="surface-eyebrow">Module 302 · Invoices</div>
      <h1 class="surface-title">Invoice status and payment summary</h1>
      <p class="surface-subtitle">
        Billing stays tied to delivery status so finance conversations can happen with the underlying project context in view.
      </p>
    </div>
    <div class="surface-actions">
      <button class="btn btn-primary" type="button" data-demo-action="Pay outstanding invoice">Pay outstanding</button>
    </div>
  </header>

  <div class="tag-row" data-client-invoice-filters>
    <button class="tag" type="button" data-filter-status="all" data-selected="true">All invoices</button>
    <button class="tag" type="button" data-filter-status="Due">Due</button>
    <button class="tag" type="button" data-filter-status="Overdue">Overdue</button>
    <button class="tag" type="button" data-filter-status="Paid">Paid</button>
  </div>

  <div class="panel-grid">
    <article class="panel panel--span-8">
      <div class="panel__heading"><h2 class="panel__title">Current invoices</h2></div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Project</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Due date</th>
            </tr>
          </thead>
          <tbody data-client-invoices></tbody>
        </table>
      </div>
    </article>

    <article class="panel panel--span-4">
      <div class="panel__heading"><h2 class="panel__title">Billing summary</h2></div>
      <div class="list-stack" data-client-summary></div>
    </article>
  </div>
</section>
<!-- SCREEN_END -->
