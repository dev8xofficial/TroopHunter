<!-- SCREEN_START -->
<section class="surface-stack">
  <header class="surface-header">
    <div class="surface-header__content">
      <div class="surface-eyebrow">Module 300 · Client dashboard</div>
      <h1 class="surface-title">Delivery overview for <span data-session-name></span></h1>
      <p class="surface-subtitle">
        The client dashboard keeps projects, billing, support, and team visibility in one route so nothing important hides behind separate tools.
      </p>
    </div>
    <div class="surface-actions">
      <button class="btn btn-primary" type="button" data-demo-action="Open support ticket">Open ticket</button>
      <button class="btn btn-secondary" type="button" data-demo-action="Download report">Download report</button>
    </div>
  </header>

  <div class="metric-grid" data-client-metrics></div>

  <div class="panel-grid">
    <article class="panel panel--span-7">
      <div class="panel__heading">
        <h2 class="panel__title">Projects needing attention</h2>
      </div>
      <div class="list-stack" data-client-projects></div>
    </article>

    <article class="panel panel--span-5">
      <div class="panel__heading">
        <h2 class="panel__title">Quick links</h2>
      </div>
      <div class="surface-actions">
        <button class="btn btn-secondary" type="button" data-demo-action="View invoice summary">Invoice summary</button>
        <button class="btn btn-secondary" type="button" data-demo-action="Open shared files">Shared files</button>
        <button class="btn btn-secondary" type="button" data-demo-action="Message delivery lead">Message lead</button>
      </div>
    </article>
  </div>
</section>
<!-- SCREEN_END -->
