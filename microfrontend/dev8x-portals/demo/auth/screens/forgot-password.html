<!-- SCREEN_START -->
<section class="auth-card">
  <div class="auth-card__heading">
    <div class="surface-eyebrow">Module 004 · Password reset</div>
    <h1 class="auth-card__title">Request a password reset.</h1>
    <p class="auth-card__copy">
      This recovery flow is currently scoped to <strong data-forgot-portal-name></strong>. The response stays identical for known and unknown accounts.
    </p>
  </div>

  <div class="alert alert--danger hidden" data-auth-message></div>

  <form data-forgot-form>
    <div class="form-group">
      <label class="form-label" for="forgot-email">Email address</label>
      <div class="form-input-wrap">
        <span class="form-icon">@</span>
        <input class="form-input" id="forgot-email" name="email" type="email" placeholder="name@company.com" required />
      </div>
    </div>

    <div class="surface-actions">
      <button class="btn btn-primary" type="submit">Send reset link</button>
      <button class="btn btn-ghost" type="button" data-back-login>Back to login</button>
    </div>
  </form>
</section>
<!-- SCREEN_END -->
