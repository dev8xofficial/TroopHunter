<section class="surface-stack">
  <header class="surface-header">
    <div class="surface-header__content">
      <div class="surface-eyebrow">Module 202 · Interviews</div>
      <h1 class="surface-title">Interview scheduling</h1>
      <p class="surface-subtitle">
        Choose a slot, keep the panel details handy, and confirm attendance without leaving the candidate workspace.
      </p>
    </div>
  </header>

  <div class="panel-grid">
    <article class="panel panel--span-7">
      <div class="panel__heading">
        <h2 class="panel__title">Available slots</h2>
        <p class="panel__copy">Select one of the recruiter-approved time windows for the final panel.</p>
      </div>
      <div class="three-grid" data-candidate-slots></div>
      <div class="surface-actions" style="margin-top:1rem" data-candidate-confirm-area style="display:none">
        <button class="btn btn-primary" type="button" data-candidate-confirm-slot>Confirm selected slot</button>
        <span class="tag" data-candidate-selected-label></span>
      </div>
    </article>

    <article class="panel panel--span-5">
      <div class="panel__heading">
        <h2 class="panel__title">Panel details</h2>
      </div>
      <div class="list-stack" data-candidate-panel-details></div>
    </article>
  </div>
</section>
<!-- SCREEN_END -->
