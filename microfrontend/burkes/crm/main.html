<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a3a52">
  <title>Burkes Group CRM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Design Tokens -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- Shell Layout -->
  <link rel="stylesheet" href="css/shell.css">
  <!-- Components -->
  <link rel="stylesheet" href="css/components.css">
  <!-- Screen overrides -->
  <link rel="stylesheet" href="css/screens.css">
  <!-- Batch 5 additions (calendar grid, timeline, campaign styles) -->
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Critical inline styles for fast render */
    body { background: var(--neutral-100, #f5f5f5); }
    #app-loading {
      position: fixed; inset: 0;
      background: var(--color-primary-navy, #1a3a52);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.3s ease;
    }
    #app-loading.fade-out { opacity: 0; pointer-events: none; }
    .loading-brand {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .loading-logo {
      width: 56px; height: 56px; border-radius: 12px;
      background: var(--color-primary-gold, #fdb913);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Archivo', sans-serif; font-weight: 800;
      font-size: 22px; color: var(--color-primary-navy, #1a3a52);
    }
    .loading-text {
      font-family: 'Archivo', sans-serif; font-size: 18px;
      font-weight: 700; color: white; letter-spacing: -0.02em;
    }
    .loading-sub {
      font-family: 'Manrope', sans-serif; font-size: 12px;
      color: rgba(255,255,255,0.45); text-transform: uppercase;
      letter-spacing: 0.08em; margin-top: -8px;
    }
    .loading-spinner {
      width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--color-primary-gold, #fdb913);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-top: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Loading Splash -->
<div id="app-loading">
  <div class="loading-brand">
    <div class="loading-logo">BG</div>
    <div class="loading-text">Burkes Group</div>
    <div class="loading-sub">CRM Platform</div>
    <div class="loading-spinner"></div>
  </div>
</div>

<!-- App Shell -->
<div id="app">
  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="Router.toggleSidebar()"></div>

  <!-- Main Content Area -->
  <div class="main-wrapper">

    <!-- Top Navigation Bar -->
    <header id="top-nav" class="top-nav"></header>

    <!-- Scrollable Content -->
    <main class="content-area" id="content-area">
      <div id="content">
        <!-- Screen content rendered here by Router -->
      </div>
    </main>

    <!-- VOIP Status Bar -->
    <div id="voip-bar" class="voip-bar"></div>

  </div>
</div>

<!-- ── JavaScript: load order matters ─────────────────── -->

<!-- 1. Mock Data (no dependencies) -->
<script src="js/mock-data.js"></script>

<!-- 2. Component Library (depends on nothing) -->
<script src="js/components/shell.js"></script>

<!-- 3. Router (depends on Components + Screens) -->
<script src="js/router.js"></script>

<!-- 4. Screens — Phase 1 Core -->
<script src="js/screens/dashboard.js"></script>
<script src="js/screens/contact.js"></script>
<script src="js/screens/pipeline.js"></script>
<script src="js/screens/calls.js"></script>
<script src="js/screens/sms.js"></script>
<script src="js/screens/email.js"></script>

<!-- 5. Screens — Phase 2 Batch 5: Activities + Calendar + Email Blast -->
<script src="js/screens/activities.js"></script>
<script src="js/screens/calendar.js"></script>
<script src="js/screens/email-blast.js"></script>
<script src="js/screens/video-meetings.js"></script>
<script src="js/screens/insurance.js"></script>
<script src="js/screens/mortgage.js"></script>
<script src="js/screens/real-estate.js"></script>

<!-- 6. App Init (last — boots everything) -->
<script src="js/app.js"></script>

</body>
</html>
