shell:
  top_nav:
    sticky: true
    height: 68px
    sections:
      - branding
      - global_search
      - quick_actions
      - notifications
      - user_context
  install_prompt:
    enabled: true
    visibility: supported_non_installed_devices
    surfaces:
      - top_nav_overflow
      - dashboard_banner
    requirements:
      - shell_loaded
      - authenticated_session
      - browser_install_support
  sidebar:
    width: 236px
    groups:
      Main:
        - Dashboard
        - Contacts
        - Pipeline
        - Activities
        - Calendar
      Communications:
        - Calls
        - SMS
        - Email
        - Email Blast
        - Video Meetings
      Departments:
        - Insurance
        - Mortgage
        - Real Estate
      Tools_Admin:
        - Integrations
        - Reports
        - Admin Settings
  content:
    padding: 32px
    max_width: 1600px
  voip_status_bar:
    visible: true
    purpose: Show live call or recording status and compliance indicators
  offline_notice:
    visible: true
    purpose: Communicate degraded offline or sync-delayed behavior for installed PWA sessions

quick_actions:
  - New Lead
  - Dial
  - SMS
  - Email
  - Meet

responsive_breakpoints:
  desktop: 1200px
  tablet: 992px
  mobile: 768px

mobile_behavior:
  sidebar: collapses_to_drawer
  top_nav: remains_sticky
  quick_actions: condense_to_overflow
  install_prompt: available
