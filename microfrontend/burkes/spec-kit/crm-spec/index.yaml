meta:
  name: Burkes Group CRM Platform
  version: "1.1.0"
  owner: Burkes Group Marketing LLC
  delivery_phase: phase_2
  saas_ready: true
  pwa_ready: true
  summary: >
    Internal operational CRM for insurance, mortgage, and real estate with
    shared contacts, pipeline management, calls, SMS, email, calendar,
    activities, department workspaces, reporting, and admin governance.

references:
  design_tokens: ./design.tokens.yaml
  layout: ./layout.yaml
  access_control: ./access_control.yaml
  api: ./api.yaml
  interactions: ./interactions.yaml
  events: ./events.yaml

departments:
  - id: insurance
    label: Insurance
    color_token: department.insurance
    phase_1: true
  - id: mortgage
    label: Mortgage
    color_token: department.mortgage
    phase_1: true
  - id: real_estate
    label: Real Estate
    color_token: department.real_estate
    phase_1: true

screens:
  dashboard:
    route: /dashboard
    phase: 1
    status: ready
    file: ./screens/dashboard.yaml
  contacts:
    route: /contacts
    phase: 1
    status: ready
    file: ./screens/contacts.yaml
  pipeline:
    route: /pipeline
    phase: 1
    status: ready
    file: ./screens/pipeline.yaml
  calls:
    route: /calls
    phase: 1
    status: ready
    file: ./screens/calls.yaml
  sms:
    route: /sms
    phase: 1
    status: ready
    file: ./screens/sms.yaml
  email:
    route: /email
    phase: 1
    status: ready
    file: ./screens/email.yaml
  activities:
    route: /activities
    phase: 2
    status: ready
    file: ./screens/activities.yaml
  calendar:
    route: /calendar
    phase: 2
    status: ready
    file: ./screens/calendar.yaml
  email_blast:
    route: /email-blast
    phase: 2
    status: ready
    file: ./screens/email-blast.yaml
  video_meetings:
    route: /video-meetings
    phase: 2
    status: ready
    file: ./screens/video-meetings.yaml
  insurance:
    route: /insurance
    phase: 2
    status: ready
    file: ./screens/insurance.yaml
  mortgage:
    route: /mortgage
    phase: 2
    status: ready
    file: ./screens/mortgage.yaml
  real_estate:
