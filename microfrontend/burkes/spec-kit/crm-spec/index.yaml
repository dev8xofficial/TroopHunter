future_capabilities:
  - native_mobile_shell
  - white_label_branding
  - ai_assist_workflows
  - deeper_docusign_or_dotloop_automation

components:
  stat_card: ./components/stat_card.yaml
  data_table: ./components/data_table.yaml
  modals: ./components/modals.yaml
  nav: ./components/nav.yaml
  pipeline_board: ./components/pipeline_board.yaml

