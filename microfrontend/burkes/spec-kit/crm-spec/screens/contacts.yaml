id: contacts
route: /contacts
title: Contacts
description: Full contact directory with department filtering, pipeline stage, and agent assignment

data_bindings:
  - key: contacts
    source: GET /api/contacts
    params:
      search:     query
      department: query
      stage:      query
      agent:      query
      page:       query
      per_page:   query (default: 12)
  - key: stats
    source: GET /api/contacts/stats
  - key: current_page
    type: local
    default: 1
  - key: filters
    type: local
    default:
      search: ""
      department: ""
      stage: ""
      agent: ""

sections:

  page_header:
    type: flex_row
    justify: space_between
    margin_bottom: 24px
    children:
      - heading:
          text: Contacts
          sub: "{contacts.total} contacts across Insurance, Mortgage & Real Estate"
      - actions:
          type: flex_row
          gap: 8px
          children:
            - export_btn:  { variant: secondary, size: sm, label: Export, icon: download }
            - import_btn:  { variant: secondary, size: sm, label: Import, icon: upload, action: open_modal(import_contacts) }
            - new_contact: { variant: primary,   size: sm, label: "New Contact", icon: plus, action: open_modal(add_contact) }

  kpi_cards:
    component: kpi_grid
    grid: kpi_4
    cards:
      - { id: total,       label: "Total Contacts",    value_binding: stats.total,       delta: stats.total_delta,     accent: navy,  icon: crm-users }
      - { id: new_month,   label: "New This Month",    value_binding: stats.new_month,   sub: "Across all departments", accent: gold,  icon: crm-sparkle }
      - { id: transferred, label: "Transferred Leads", value_binding: stats.transferred, sub: "Agent-to-agent handoffs", accent: blue, icon: crm-refresh }
      - { id: closed,      label: "Closed Clients",    value_binding: stats.closed,      delta: stats.closed_delta,    accent: green, icon: crm-check }

  filter_card:
    component: card
    body:
      - filter_bar:
          type: flex_row
          gap: 10px
          flex_wrap: true
          children:
            - search_input:
                type: search
                placeholder: "Search by name, email, or phone…"
                icon: crm-search
                width: 240px
                binding: filters.search
                debounce_ms: 300

            - dept_select:
                type: select
                label: "All Departments"
                options:
                  - { value: "", label: "All Departments" }
                  - { value: Insurance, label: Insurance }
                  - { value: Mortgage,  label: Mortgage }
                  - { value: "Real Estate", label: "Real Estate" }
                binding: filters.department

            - stage_select:
                type: select
                options:
                  - { value: "",             label: "All Stages" }
                  - { value: New,            label: "New Inquiry" }
                  - { value: Contacted,      label: Contacted }
                  - { value: Quoted,         label: "Quoted / Offer" }
                  - { value: "Under Contract", label: "Under Contract" }
                  - { value: Closed,         label: Closed }
                binding: filters.stage

            - agent_select:
                type: select
                options:
                  - { value: "",                    label: "All Agents" }
                  - { value: "Jaquarian Bonilla",   label: "Jaquarian Bonilla" }
                  - { value: "Tom Burke",            label: "Tom Burke" }
                binding: filters.agent

            - spacer: {}
            - view_toggle:
                component: mini_tabs
                options: [Table, Cards]
                binding: contacts_view
            - result_count:
                type: text
                binding: contacts.total
                format: "{n} contacts"

      - quick_filters:
          type: flex_row
          gap: 8px
          padding: "10px 18px"
          border_top: default
          children:
            - { label: "All",          badge_value: "1,284", action: clear_filters,               variant: neutral }
            - { label: Insurance,      badge_value: "512",   action: filter(department,Insurance), variant: gold,   icon: crm-shield }
            - { label: Mortgage,       badge_value: "381",   action: filter(department,Mortgage),  variant: blue,   icon: crm-bank }
            - { label: "Real Estate",  badge_value: "391",   action: filter(department,Real Estate),variant: green, icon: crm-buildings }
            - spacer: {}
            - { label: "Missing Data", badge_value: "28",    action: filter(missing_data,true),     variant: red,   icon: crm-warning }

      - contacts_table:
          component: data_table
          id: contacts_table
          binding: contacts.items
          row_action: open_contact_detail
          columns:
            - { id: select,       type: checkbox }
            - { id: contact,      label: Contact,      type: contact_cell,    sortable: true }
            - { id: department,   label: Department,   type: dept_badge,      sortable: true }
            - { id: stage,        label: Stage,        type: status_pill,     sortable: true }
            - { id: assigned_to,  label: "Assigned To",type: text,            sortable: true }
            - { id: last_activity,label: "Last Activity",type: datetime,      sortable: true }
            - { id: source,       label: Source,       type: text }
            - { id: actions,      label: Actions,      type: action_group,
                actions:
                  - { icon: crm-phone, title: Call,   action: voip_call }
                  - { icon: crm-chat,  title: SMS,    action: open_sms }
                  - { icon: crm-mail,  title: Email,  action: compose_email }
                  - { icon: crm-refresh, title: Transfer, action: open_modal(transfer_lead) }
                  - { icon: crm-pencil,  title: Edit,  action: open_modal(edit_contact) }
                  - { icon: crm-trash,   title: Delete, action: confirm_delete, variant: danger } }

      - pagination:
          component: pagination
          binding: contacts.pagination
          actions:
            prev: prev_page
            next: next_page
            goto: goto_page

modals:
  add_contact:
    title: "New Contact"
    fields:
      - { id: fname,    label: "First Name",    type: text,   required: true }
      - { id: lname,    label: "Last Name",     type: text,   required: true }
      - { id: phone,    label: Phone,           type: tel,    required: true }
      - { id: email,    label: Email,           type: email }
      - { id: dob,      label: "Date of Birth", type: date }
      - { id: dept,     label: Department,      type: select, required: true, options_ref: departments }
      - { id: stage,    label: "Pipeline Stage",type: select, options_ref: pipeline_stages }
      - { id: source,   label: "Lead Source",   type: select, options_ref: lead_sources }
      - { id: agent,    label: "Assigned Agent",type: select, options_ref: agents }
      - { id: notes,    label: Notes,           type: textarea }
      - id: sync_options
        type: checkbox_group
        label: "Auto-Sync To"
        options: [Outlook, Vertafore, Arive]
    actions:
      submit: POST /api/contacts
      cancel: close_modal

  import_contacts:
    title: "Import Contacts"
    description: "Import via Follow Up Boss migration or CSV upload"
    fields:
      - { id: file, label: "Upload CSV", type: file, accept: ".csv" }
      - { id: source, label: Source, type: select, options: ["Follow Up Boss", "CSV Upload"] }
    actions:
      submit: POST /api/contacts/import

states:
  loading:    { table: skeleton, kpi_cards: skeleton }
  empty:      { icon: crm-users, message: "No contacts found. Adjust filters or add a new contact." }
  error:      { alert: "Failed to load contacts.", action: retry }