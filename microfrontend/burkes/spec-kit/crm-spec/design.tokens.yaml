tokens:

  # ─── Brand Colors ───────────────────────────────────────────────────────────
  color:
    brand:
      navy:         { value: "#1a3a52", usage: "Primary brand, active nav, headings" }
      navy_hover:   { value: "#2d5a7b", usage: "Navy hover/focus states" }
      gold:         { value: "#fdb913", usage: "CTA buttons, insurance dept accent" }
      gold_bg:      { value: "#fffbeb", usage: "Gold-tinted backgrounds" }
      gold_border:  { value: "#fde68a", usage: "Gold-tinted borders" }

    semantic:
      success:      { value: "#10b981", alias: "green" }
      success_bg:   { value: "#d1fae5" }
      success_text: { value: "#065f46" }
      warning:      { value: "#f59e0b", alias: "orange" }
      warning_bg:   { value: "#fef3c7" }
      warning_text: { value: "#92400e" }
      danger:       { value: "#ef4444", alias: "red" }
      danger_bg:    { value: "#fee2e2" }
      danger_text:  { value: "#991b1b" }
      info:         { value: "#3b82f6", alias: "blue" }
      info_bg:      { value: "#dbeafe" }
      info_text:    { value: "#1e40af" }
      purple:       { value: "#7c3aed" }
      purple_bg:    { value: "#f3e8ff" }
      purple_text:  { value: "#7c3aed" }

    neutral:
      n50:   { value: "#fafafa" }
      n100:  { value: "#f5f5f5" }
      n200:  { value: "#e5e5e5" }
      n300:  { value: "#d4d4d4" }
      n400:  { value: "#a3a3a3" }
      n500:  { value: "#737373" }
      n600:  { value: "#525252" }
      n700:  { value: "#404040" }
      n800:  { value: "#262626" }
      n900:  { value: "#171717" }

    department:
      insurance:   { value: "{color.brand.gold}",    bg: "{color.brand.gold_bg}" }
      mortgage:    { value: "{color.semantic.info}",  bg: "{color.semantic.info_bg}" }
      real_estate: { value: "{color.semantic.success}", bg: "{color.semantic.success_bg}" }
      internal:    { value: "{color.brand.navy}",    bg: "#e0eaf2" }

  # ─── Typography ─────────────────────────────────────────────────────────────
  font:
    family:
      heading: { value: "Archivo, sans-serif", weights: [400, 500, 600, 700, 800] }
      body:    { value: "Manrope, sans-serif", weights: [400, 500, 600, 700] }

    size:
      xs:   { value: "10px" }
      sm:   { value: "11px" }
      base: { value: "13px" }
      md:   { value: "14px" }
      lg:   { value: "16px" }
      xl:   { value: "18px" }
      2xl:  { value: "22px" }
      3xl:  { value: "26px" }
      4xl:  { value: "28px" }
      5xl:  { value: "32px" }

    weight:
      regular:   400
      medium:    500
      semibold:  600
      bold:      700
      extrabold: 800

    line_height:
      tight:   1.2
      normal:  1.5
      relaxed: 1.7

  # ─── Spacing ─────────────────────────────────────────────────────────────────
  spacing:
    0:  "0px"
    1:  "4px"
    2:  "8px"
    3:  "12px"
    4:  "14px"
    5:  "16px"
    6:  "18px"
    7:  "20px"
    8:  "22px"
    9:  "24px"
    10: "28px"
    11: "32px"

  # ─── Shadows ─────────────────────────────────────────────────────────────────
  shadow:
    sm:  "0 1px 2px 0 rgba(0,0,0,0.05)"
    md:  "0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05)"
    lg:  "0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05)"
    xl:  "0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05)"

  # ─── Border Radius ───────────────────────────────────────────────────────────
  radius:
    xs:   "5px"
    sm:   "6px"
    md:   "8px"
    lg:   "10px"
    xl:   "12px"
    2xl:  "14px"
    3xl:  "16px"
    full: "9999px"

  # ─── Border ──────────────────────────────────────────────────────────────────
  border:
    width:
      default: "1px"
      thick:   "1.5px"
      thicker: "2px"
    color:
      default: "{color.neutral.n200}"
      focus:   "{color.brand.navy}"
      strong:  "{color.neutral.n300}"

  # ─── Z-Index ──────────────────────────────────────────────────────────────────
  z_index:
    base:    0
    nav:     100
    drawer:  200
    modal:   300
    toast:   999

  # ─── Transition ───────────────────────────────────────────────────────────────
  transition:
    fast:    "0.15s ease"
    default: "0.2s ease"
    slow:    "0.3s ease"

  # ─── Badge variants (semantic shortcuts) ─────────────────────────────────────
  badge:
    navy:    { bg: "#e0eaf2",                text: "{color.brand.navy}" }
    gold:    { bg: "{color.brand.gold_bg}",  text: "#92400e",            border: "{color.brand.gold_border}" }
    green:   { bg: "{color.semantic.success_bg}", text: "{color.semantic.success_text}" }
    red:     { bg: "{color.semantic.danger_bg}",  text: "{color.semantic.danger_text}" }
    blue:    { bg: "{color.semantic.info_bg}",    text: "{color.semantic.info_text}" }
    orange:  { bg: "{color.warning_bg}",     text: "{color.warning_text}" }
    purple:  { bg: "{color.purple_bg}",      text: "{color.purple_text}" }
    neutral: { bg: "{color.neutral.n100}",   text: "{color.neutral.n700}" }

  # ─── Status Pill variants ────────────────────────────────────────────────────
  status_pill:
    green:  { bg: "{color.semantic.success_bg}", text: "{color.semantic.success_text}" }
    gold:   { bg: "{color.brand.gold_bg}",  text: "#92400e" }
    blue:   { bg: "{color.semantic.info_bg}", text: "{color.semantic.info_text}" }
    red:    { bg: "{color.semantic.danger_bg}", text: "{color.semantic.danger_text}" }
    purple: { bg: "{color.purple_bg}",     text: "{color.purple_text}" }
    orange: { bg: "{color.warning_bg}",    text: "{color.warning_text}" }
    gray:   { bg: "{color.neutral.n100}",  text: "{color.neutral.n600}" }