color:
  brand:
    primary_navy: "#1a3a52"
    accent_blue: "#2d5a7b"
    primary_gold: "#fdb913"
  neutral:
    "50": "#fafafa"
    "100": "#f5f5f5"
    "200": "#e5e5e5"
    "300": "#d4d4d4"
    "400": "#a3a3a3"
    "500": "#737373"
    "600": "#525252"
    "700": "#404040"
    "800": "#262626"
    "900": "#171717"
  semantic:
    success: "#10b981"
    success_bg: "#d1fae5"
    warning: "#f59e0b"
    warning_bg: "#fef3c7"
    danger: "#ef4444"
    danger_bg: "#fee2e2"
    info: "#3b82f6"
    info_bg: "#dbeafe"
  department:
    insurance: "#fdb913"
    mortgage: "#3b82f6"
    real_estate: "#10b981"

typography:
  families:
    heading: Archivo, sans-serif
    body: Manrope, sans-serif
  sizes:
    xs: 11px
    sm: 13px
    md: 14px
    lg: 16px
    xl: 18px
    "2xl": 22px
    "3xl": 28px
    "4xl": 32px
  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700

spacing:
  "1": 4px
  "2": 8px
  "3": 12px
  "4": 16px
  "5": 20px
  "6": 24px
  "7": 32px

radii:
  sm: 6px
  md: 8px
  lg: 10px
  xl: 16px
  full: 9999px

shadows:
  sm: 0 1px 2px 0 rgba(0,0,0,0.05)
  md: 0 4px 6px -1px rgba(0,0,0,0.1)
  lg: 0 10px 15px -3px rgba(0,0,0,0.1)

status_badges:
  green:
    bg: "#d1fae5"
    text: "#065f46"
  gold:
    bg: "#fffbeb"
    text: "#92400e"
  blue:
    bg: "#dbeafe"
    text: "#1e40af"
  red:
    bg: "#fee2e2"
    text: "#991b1b"
  neutral:
    bg: "#f5f5f5"
    text: "#404040"
