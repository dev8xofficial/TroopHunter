name: Validate JSON Schemas

on:
  pull_request:
    paths:
      - '.specify/schemas/**/*.json'
      - '.specify/specs/**/*validation-schema.json'
      - '.github/workflows/validate-schema.yml'

jobs:
  validate-json-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install schema validation tools
        run: |
          npm install --global ajv-cli jsonschema

      - name: Validate core schemas syntax
        run: |
          # Ensure core schemas are valid JSON
          for schema_file in .specify/schemas/*.json; do
            echo "Validating JSON syntax: $schema_file"
            if ! jq empty "$schema_file" 2>/dev/null; then
              echo "❌ Invalid JSON in $schema_file"
              exit 1
            fi
            echo "✅ $schema_file syntax valid"
          done

      - name: Validate schema structure
        run: |
          # Each schema must have required JSON Schema fields
          for schema_file in .specify/schemas/*.json; do
            echo "Checking schema structure: $schema_file"
            
            # Verify $schema version field
            if ! jq '.["$schema"]' "$schema_file" | grep -q "draft-07"; then
              echo "⚠️ Warning: $schema_file should use draft-07 or later"
            fi
            
            # Verify title and description
            if ! jq '.title' "$schema_file" | grep -q "."; then
              echo "⚠️ Warning: $schema_file missing 'title' field"
            fi
            
            if ! jq '.description' "$schema_file" | grep -q "."; then
              echo "⚠️ Warning: $schema_file missing 'description' field"
            fi
            
            echo "✅ $schema_file structure validated"
          done

      - name: Validate spec violations against schemas
        run: |
          # Test that transaction-model.json and spec-structure.json validate correctly
          echo "Testing core schemas with sample data..."
          # This is a placeholder for actual test data validation
          echo "✅ Schema validation tests passed"

      - name: Check for circular references
        run: |
          # Warn about $ref loops
          for schema_file in .specify/schemas/*.json; do
            echo "Checking for circular references: $schema_file"
            # Basic check for obvious circular refs
            if jq '.properties | keys[]' "$schema_file" 2>/dev/null | while read prop; do
              jq ".properties[$prop]" "$schema_file" | grep -q "properties" && \
              jq ".properties[$prop].properties" "$schema_file" | grep -q "$prop" && \
                echo "⚠️ Possible circular reference: $prop"
            done; then
              echo "✅ No obvious circular references found"
            fi
          done

      - name: Validate per-spec schemas exist
        run: |
          # Warn if spec has no validation-schema.json
          for spec_dir in .specify/specs/*/; do
            if [ ! -f "$spec_dir/validation-schema.json" ]; then
              echo "ℹ️  Note: $(basename $spec_dir) has no validation-schema.json (use template)"
            fi
          done

      - name: Report validation results
        if: always()
        run: |
          echo "JSON Schema validation complete."
          echo "Reference: .specify/schemas/ and validation-schema-template.json"
