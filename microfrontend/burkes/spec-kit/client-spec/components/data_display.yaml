---
# ── Data Display Components ───────────────────────────────────────────────────

# ── DataTable ─────────────────────────────────────────────────────────────────
DataTable:
  props:
    source:       data_array
    columns:      Column[]
    empty_message:string?
    striped:      boolean?
  Column:
    id:     string
    label:  string
    render: ComponentRef?     # custom cell renderer
    align:  { enum: [left, center, right], default: left }
  base:
    width:            "100%"
    border_collapse:  collapse
  th:
    text_align:    left
    padding:       "14px 20px"
    font_weight:   700
    color:         "brand.primary_navy"
    font_size:     "12px"
    text_transform:uppercase
    letter_spacing:"0.5px"
    border_bottom: "2px solid neutral.200"
    background:    "neutral.50"
  td:
    padding:       "15px 20px"
    border_bottom: "1px solid neutral.100"
    font_size:     "14px"
    vertical_align:middle
  row_hover:
    background: "#f8fafc"
  last_row:
    border_bottom: none

# ── DocumentNameCell ──────────────────────────────────────────────────────────
DocumentNameCell:
  layout: flex
  gap: "10px"
  children:
    icon_box:
      component: FileTypeIcon
      size: "36px"
      border_radius: radius.md
      type_colors:
        pdf:  "#fee2e2"
        word: "#dbeafe"
    text:
      name: { font_weight: 600, color: "brand.primary_navy", font_size: "13px" }
      size: { font_size: "11px", color: "neutral.400" }

# ── RoleCell ──────────────────────────────────────────────────────────────────
RoleCell:
  layout: flex
  align_items: center
  gap: "5px"
  children:
    dot:
      width:         "7px"
      height:        "7px"
      border_radius: full
      color:         "color.role[role]"
    label:
      font_size: "12px"
      color:     "neutral.600"

# ── DocumentActionsCell ───────────────────────────────────────────────────────
DocumentActionsCell:
  layout: flex
  gap: "5px"
  renders_by_status: true    # screen yamls define per-status action sets

# ── TransactionTimeline ───────────────────────────────────────────────────────
TransactionTimeline:
  props:
    stages:  Stage[]
    current_stage: number
  Stage:
    id:          string
    number:      number
    title:       string
    description: string
    status:      { enum: [completed, in_progress, pending] }
    date_label:  string?
    sub_badges:  Badge[]?
  item_base:
    display:     flex
    gap:         "16px"
    padding:     "18px 0"
    position:    relative
  connector_line:
    position:    absolute
    left:        "17px"
    width:       "2px"
    color_by_status:
      completed:   "color.semantic.success"
      in_progress: "gradient from color.semantic.success to neutral.200"
      pending:     "neutral.200"
  marker:
    width:        "36px"
    height:       "36px"
    border_radius:radius.lg
    flex_shrink:  0
    color_by_status:
      completed:   { background: "color.semantic.success", color: white, label: "✓" }
      in_progress: { background: "brand.primary_gold",     color: "brand.primary_navy", label: "⏱" }
      pending:     { background: "neutral.100",            color: "neutral.400", label: stage_number }

# ── ActivityFeed ──────────────────────────────────────────────────────────────
ActivityFeed:
  props:
    items:  ActivityItem[]
  ActivityItem:
    icon:      string
    label:     string
    body:      string
    timestamp: string
  item_base:
    padding:       "12px 14px"
    background:    "neutral.50"
    border_radius: radius.lg
    border:        "1px solid neutral.200"
    transition:    transition.default
    cursor:        pointer
  item_hover:
    background:    white
    border_color:  "brand.primary_navy"

# ── DocumentPreviewList ───────────────────────────────────────────────────────
DocumentPreviewList:
  props:
    items:     Document[]
    max_items: number?
  per_item:
    layout:    flex
    justify:   space-between
    children:
      meta:
        name:  { font_weight: 600, font_size: "13px", color: "brand.primary_navy" }
        by:    { font_size: "11px", color: "neutral.500" }
      status:  StatusBadge
    actions:   ButtonGroup
  item_base:
    padding:       "13px"
    background:    "neutral.50"
    border_radius: radius.lg
    border:        "1px solid neutral.200"
    margin_bottom: "9px"
  item_hover:
    background:    white
    border_color:  "brand.accent_blue"

# ── TeamMemberList ────────────────────────────────────────────────────────────
TeamMemberList:
  props:
    members: TeamMember[]
  per_item:
    layout:     flex
    align:      center
    gap:        "10px"
    padding:    "10px"
    background: "neutral.50"
    border:     "1px solid neutral.200"
    border_radius: radius.md
    children:
      avatar:   Avatar
      info:
        name:   { font_weight: 600, font_size: "12px" }
        role:   { font_size: "11px", color: "neutral.600" }
      action:   Button

# ── QuickActionList ───────────────────────────────────────────────────────────
QuickActionList:
  props:
    items: QuickAction[]
  per_item:
    layout:        flex
    align_items:   center
    gap:           "11px"
    padding:       "12px 14px"
    background:    "neutral.50"
    border:        "1px solid neutral.200"
    border_radius: radius.lg
    width:         "100%"
    transition:    transition.default
  item_hover:
    background:    "brand.primary_navy"
    color:         white
    border_color:  "brand.primary_navy"

# ── MortgageSummaryCard ───────────────────────────────────────────────────────
MortgageSummaryCard:
  extends: Card
  custom_background: "gradient.mortgage_bg"
  border:            "2px solid #bfdbfe"
  stats_grid:
    columns: 3
    gap:     "10px"
  stat_cell:
    background:    white
    border_radius: radius.md
    padding:       "10px"
    text_align:    center

# ── InsuranceSummaryCard ──────────────────────────────────────────────────────
InsuranceSummaryCard:
  extends: Card
  custom_background: "gradient.insurance_bg"
  border:            "2px solid #bbf7d0"
  status_grid:
    columns: 3
    gap:     "10px"
  status_cell:
    background:    white
    border_radius: radius.md
    padding:       "10px"
    text_align:    center

# ── ProviderCard ──────────────────────────────────────────────────────────────
ProviderCard:
  props:
    provider: ServiceProvider
    is_recommended: boolean?
  base:
    background:    "neutral.50"
    padding:       "14px"
    border_radius: radius.md
    border:        "1px solid neutral.200"
    margin_bottom: "14px"
  recommended_badge:
    position: top-right
    component: Badge
    variant: green
    label: "Recommended"

# ── ThreadList ────────────────────────────────────────────────────────────────
ThreadList:
  props:
    threads: Thread[]
    active_id: string
  per_item:
    layout:     flex
    gap:        "11px"
    padding:    "13px 14px"
    border_bottom: "1px solid neutral.100"
    transition: transition.fast
    cursor:     pointer
  item_hover:
    background: "neutral.50"
  item_active:
    background:  "#eef3f8"
    border_left: "3px solid brand.primary_navy"
  item_unread:
    font_weight: 700

# ── MessageBubble ─────────────────────────────────────────────────────────────
MessageBubble:
  props:
    message:   Message
    direction: { enum: [inbound, outbound] }
  attachment_doc:
    layout:        flex
    align_items:   center
    gap:           "9px"
    padding:       "9px 12px"
    border_radius: radius.md
    margin_top:    "7px"
    cursor:        pointer

# ── AnnouncementBanner ────────────────────────────────────────────────────────
AnnouncementBanner:
  props:
    icon:  string
    title: string
    body:  string
  base:
    background:    "gradient.navy_to_blue"
    border_radius: radius.lg
    padding:       "14px 18px"
    color:         white
    display:       flex
    gap:           "12px"
    align_items:   center

# ── StarRating ────────────────────────────────────────────────────────────────
StarRating:
  props:
    value:    number    # e.g. 4.7
    max:      { default: 5 }
  star_color: "brand.primary_gold"
  empty_color:"neutral.300"