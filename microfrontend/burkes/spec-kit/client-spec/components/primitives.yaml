---
# ── Primitive Components ──────────────────────────────────────────────────────
# Atomic, stateless building blocks consumed by all screens.

# ── Button ────────────────────────────────────────────────────────────────────
Button:
  props:
    label:    string          # required
    variant:  { enum: [primary, secondary, ghost], default: primary }
    size:     { enum: [sm, md], default: md }
    icon:     string?         # leading emoji or icon
    disabled: boolean?
    loading:  boolean?
    full_width: boolean?
  variants:
    primary:
      background: "brand.primary_navy"
      color:      white
      hover:
        background: "brand.accent_blue"
        transform:  "translateY(-1px)"
        shadow:     shadow.md
    secondary:
      background: white
      color:      "brand.primary_navy"
      border:     "2px solid brand.primary_navy"
      hover:
        background: "brand.primary_navy"
        color:      white
    ghost:
      background: "neutral.100"
      color:      "neutral.700"
      border:     "1px solid neutral.200"
      hover:
        background: "neutral.200"
  sizes:
    sm: { padding: "6px 13px",  font_size: "12px" }
    md: { padding: "9px 18px",  font_size: "13px" }
  base:
    border_radius: radius.md
    font_family:   body
    font_weight:   600
    transition:    transition.default
    display:       inline-flex
    align_items:   center
    gap:           "5px"

# ── Badge ─────────────────────────────────────────────────────────────────────
Badge:
  props:
    label:   string
    variant: { enum: [green, yellow, blue, red, gray, navy], default: gray }
    icon:    string?
  variants:
    green:  { bg: "color.badge.green_bg",  text: "color.badge.green_text" }
    yellow: { bg: "color.badge.yellow_bg", text: "color.badge.yellow_text" }
    blue:   { bg: "color.badge.blue_bg",   text: "color.badge.blue_text" }
    red:    { bg: "color.badge.red_bg",    text: "color.badge.red_text" }
    gray:   { bg: "color.badge.gray_bg",   text: "color.badge.gray_text" }
    navy:   { bg: "color.badge.navy_bg",   text: "color.badge.navy_text" }
  base:
    display:       inline-flex
    align_items:   center
    gap:           "4px"
    padding:       "5px 11px"
    border_radius: radius.sm
    font_size:     "11px"
    font_weight:   700
    letter_spacing:"0.3px"

# ── Status → Badge variant mapping ────────────────────────────────────────────
StatusBadge:
  extends: Badge
  status_map:
    complete:         { variant: green,  label: "✅ Complete" }
    approved:         { variant: green,  label: "✅ Approved" }
    completed:        { variant: green,  label: "✅ Completed" }
    needs_signature:  { variant: blue,   label: "✍️ Needs Signature" }
    under_review:     { variant: yellow, label: "🕐 Under Review" }
    needs_review:     { variant: yellow, label: "🕐 Needs Review" }
    pending:          { variant: yellow, label: "⏱ Pending" }
    in_progress:      { variant: yellow, label: "⚡ In Progress" }
    not_started:      { variant: gray,   label: "Not Started" }

# ── Alert ─────────────────────────────────────────────────────────────────────
Alert:
  props:
    variant:  { enum: [warning, info], default: warning }
    icon:     string?
    title:    string
    body:     string
    actions:  Action[]?
  variants:
    warning:
      background:    "#fff7ed"
      border_left:   "4px solid color.semantic.warning"
      border_radius: radius.md
    info:
      background:    "#eff6ff"
      border_left:   "4px solid color.semantic.info"
      border_radius: radius.md
  base:
    padding:    "13px 16px"
    display:    flex
    gap:        "10px"
    align_items:flex-start

# ── Card ──────────────────────────────────────────────────────────────────────
Card:
  props:
    title:       string?
    subtitle:    string?
    header_action: Action?
    padding:     string?
    hover:       boolean?
  base:
    background:    white
    border_radius: radius.xl
    shadow:        shadow.md
    border:        "1px solid neutral.200"
  header:
    padding:       "18px 22px"
    border_bottom: "1px solid neutral.200"
    display:       flex
    justify:       space-between
    align_items:   center
  body:
    padding:       "22px"

# ── StatCard ──────────────────────────────────────────────────────────────────
StatCard:
  extends: Card
  props:
    label:       string
    value:       string
    description: string?
    icon:        string?
  hover:
    border_color: "brand.primary_navy"
    shadow:       shadow.lg
    transform:    "translateY(-2px)"

# ── ProgressBar ───────────────────────────────────────────────────────────────
ProgressBar:
  props:
    value_pct: number      # 0–100
    height:    { default: "7px" }
    animated:  boolean?
  track:
    background:    "neutral.200"
    border_radius: radius.pill
  fill:
    background:    "gradient.progress_fill"
    border_radius: radius.pill
    transition:    "width 0.5s ease"

# ── Avatar ────────────────────────────────────────────────────────────────────
Avatar:
  props:
    initials:  string          # 2 chars
    color_key: string          # maps to color.role.*
    size:      { enum: [sm, md, lg], default: md }
  sizes:
    sm: { width: "34px", height: "34px", font_size: "13px" }
    md: { width: "40px", height: "40px", font_size: "14px" }
    lg: { width: "54px", height: "54px", font_size: "20px" }
  base:
    border_radius: radius.lg
    display:       flex
    align_items:   center
    justify:       center
    font_weight:   700
    color:         white

# ── SearchInput ───────────────────────────────────────────────────────────────
SearchInput:
  props:
    placeholder: string?
    bind:        string
  base:
    padding:       "9px 13px 9px 34px"
    border:        "1px solid neutral.300"
    border_radius: radius.md
    font_size:     "13px"
    width:         "240px"
    transition:    transition.default
  focus:
    border_color:  "brand.primary_navy"
    shadow:        "0 0 0 3px rgba(26,58,82,0.1)"
  leading_icon:
    emoji: "🔍"
    color: "neutral.400"

# ── FilterTabs ────────────────────────────────────────────────────────────────
FilterTabs:
  props:
    tabs:  Tab[]
    bind:  string          # bound to active tab id
  Tab:
    id:    string
    label: string
    count: number?
  tab_base:
    padding:       "7px 14px"
    border_radius: radius.md
    font_size:     "12px"
    font_weight:   600
    border:        "1px solid neutral.200"
    background:    white
    color:         "neutral.600"
    transition:    transition.default
  tab_active:
    background:   "brand.primary_navy"
    color:        white
    border_color: "brand.primary_navy"
  count_chip:
    base:   { background: "neutral.200", color: "neutral.700" }
    active: { background: "rgba(255,255,255,0.3)" }