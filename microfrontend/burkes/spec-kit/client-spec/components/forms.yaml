---
# ── Form Components ───────────────────────────────────────────────────────────

# ── Base Field Styles ─────────────────────────────────────────────────────────
_field_base: &field_base
  padding:       "8px 11px"
  border:        "1px solid neutral.300"
  border_radius: radius.sm
  font_size:     "13px"
  font_family:   body
  width:         "100%"
  transition:    transition.default
  focus:
    outline:    none
    border_color: "brand.primary_navy"
    shadow:       "0 0 0 3px rgba(26,58,82,0.1)"

_label_base: &label_base
  display:       block
  font_size:     "12px"
  font_weight:   600
  color:         "neutral.700"
  margin_bottom: "4px"

# ── TextInput ─────────────────────────────────────────────────────────────────
TextInput:
  props:
    id:          string
    label:       string
    placeholder: string?
    bind:        string
    type:        { enum: [text, email, tel, password], default: text }
    required:    boolean?
    disabled:    boolean?
    max_length:  number?
    transform:   { enum: [uppercase, lowercase, none], default: none }
    sensitive:   boolean?    # mask display
    mask:        string?     # display pattern e.g. ***-**-XXXX
  label_styles: *label_base
  input_styles: *field_base

# ── DateInput ─────────────────────────────────────────────────────────────────
DateInput:
  extends: TextInput
  props:
    type: date
  input_styles: *field_base

# ── SelectInput ───────────────────────────────────────────────────────────────
SelectInput:
  props:
    id:      string
    label:   string
    bind:    string
    options: SelectOption[]
    required:boolean?
  SelectOption:
    value: string
    label: string
  label_styles: *label_base
  select_styles: *field_base

# ── TextareaInput ─────────────────────────────────────────────────────────────
TextareaInput:
  props:
    id:          string
    label:       string
    placeholder: string?
    bind:        string
    rows:        { default: 3 }
    optional:    boolean?
    resize:      { enum: [vertical, none, both], default: vertical }
  label_styles: *label_base
  textarea_styles:
    <<: *field_base
    resize:      vertical
    min_height:  "43px"
    max_height:  "110px"
    line_height: 1.5

# ── CurrencyInput ─────────────────────────────────────────────────────────────
CurrencyInput:
  extends: TextInput
  props:
    type:   text
    prefix: "$"
  format: comma_separated_number

# ── UploadDropZone ────────────────────────────────────────────────────────────
UploadDropZone:
  props:
    accepted_types: string[]
    max_size_mb:    number
    label:          string?
    description:    string?
  base:
    border:        "2px dashed neutral.300"
    border_radius: radius.xl
    padding:       "28px"
    text_align:    center
    background:    "neutral.50"
    cursor:        pointer
    transition:    transition.default
  hover:
    border_color:  "brand.primary_navy"
    background:    "#f0f5fa"
  inner:
    icon:        { font_size: "32px", margin_bottom: "10px" }
    heading:     { font_size: "15px", font_weight: 600, color: "brand.primary_navy" }
    description: { font_size: "12px", color: "neutral.500" }
  actions:
    layout:      flex
    justify:     center
    gap:         "8px"
    margin_top:  "14px"

# ── InsuranceFormCard ─────────────────────────────────────────────────────────
InsuranceFormCard:
  extends: Card
  props:
    title:       string
    subtitle:    string
    status_badge:string       # status key → StatusBadge
    fields:      FormField[]
    submit:      SubmitAction
  layout: vertical_stack
  field_spacing: "14px"

# ── SectionCard (Mortgage form sections) ─────────────────────────────────────
SectionCard:
  extends: Card
  props:
    title:         string
    subtitle:      string
    section_id:    string
    status:        string
    inline_alert:  Alert?
    form:          FormDefinition
    submit:        SubmitAction?
    action:        Action?
    secondary_action: Action?
  status_badge:
    position: card_header_right
    component: StatusBadge

# ── ComposeBar ────────────────────────────────────────────────────────────────
ComposeBar:
  props:
    bind_text:    string
    tools:        ToolButton[]
    send_action:  string
    send_trigger: string[]
  tools_row:
    display:       flex
    gap:           "5px"
    margin_bottom: "9px"
  tool_button:
    width:         "30px"
    height:        "30px"
    border_radius: radius.sm
    background:    "neutral.100"
    border:        none
    font_size:     "14px"
    cursor:        pointer
    transition:    transition.default
    hover:
      background: "neutral.200"
  compose_row:
    display:    flex
    gap:        "9px"
    align_items:flex-end
  textarea:
    flex:          1
    padding:       "11px 14px"
    border:        "1px solid neutral.200"
    border_radius: radius.lg
    font_size:     "13px"
    resize:        none
    min_height:    "43px"
    max_height:    "110px"
    transition:    transition.default
    focus:
      border_color: "brand.primary_navy"
      shadow:       "0 0 0 3px rgba(26,58,82,0.1)"
  send_button:
    width:         "42px"
    height:        "42px"
    border_radius: radius.lg
    background:    "brand.primary_navy"
    color:         white
    border:        none
    font_size:     "17px"
    flex_shrink:   0
    transition:    transition.default
    hover:
      background: "brand.accent_blue"
      transform:  "translateY(-1px)"

# ── ProgressCard (Mortgage overview) ─────────────────────────────────────────
ProgressCard:
  extends: Card
  props:
    title:        string
    subtitle:     string
    progress_pct: number
    section_badges: SectionBadge[]
  layout: vertical_stack
  includes:
    ProgressBar
    section_badges_row: { display: flex, gap: "10px", flex_wrap: wrap, margin_top: "14px" }

# ── LenderCard ────────────────────────────────────────────────────────────────
LenderCard:
  extends: Card
  props:
    lender:         TeamMember
    status_message: string
    action:         Action
  layout: flex
  gap: "18px"
  children:
    avatar:         Avatar (size: lg)
    info:
      name:         string
      title:        string
      contact:      ContactLinks
      status_box:   { background: "neutral.50", padding: "12px", border_radius: radius.sm }
    action:         Button