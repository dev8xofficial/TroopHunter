---
# ── Design Tokens ─────────────────────────────────────────────────────────────
# Source of truth for all visual constants. Do NOT hardcode values elsewhere.

# ── Color Palette ─────────────────────────────────────────────────────────────
color:
  brand:
    primary_navy:   "#1a3a52"
    primary_gold:   "#fdb913"
    accent_blue:    "#2d5a7b"

  semantic:
    success:        "#10b981"
    warning:        "#f59e0b"
    error:          "#ef4444"
    info:           "#3b82f6"

  neutral:
    "50":   "#fafafa"
    "100":  "#f5f5f5"
    "200":  "#e5e5e5"
    "300":  "#d4d4d4"
    "400":  "#a3a3a3"
    "500":  "#737373"
    "600":  "#525252"
    "700":  "#404040"
    "800":  "#262626"

  role:
    agent:    "#6366f1"
    lender:   "#3b82f6"
    attorney: "#8b5cf6"
    client:   "#10b981"
    cpa:      "#f59e0b"
    admin:    "#fdb913"   # primary_gold

  badge:
    green_bg:   "#d1fae5"
    green_text: "#065f46"
    yellow_bg:  "#fef3c7"
    yellow_text:"#92400e"
    blue_bg:    "#dbeafe"
    blue_text:  "#1e40af"
    red_bg:     "#fee2e2"
    red_text:   "#991b1b"
    gray_bg:    "#f5f5f5"
    gray_text:  "#525252"
    navy_bg:    "#e0eaf1"
    navy_text:  "#1a3a52"

# ── Typography ────────────────────────────────────────────────────────────────
typography:
  font_family:
    display: "'Archivo', sans-serif"
    body:    "'Manrope', sans-serif"

  google_fonts_url: "https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"

  scale:
    xs:   "10px"
    sm:   "11px"
    base: "13px"
    md:   "14px"
    lg:   "15px"
    xl:   "17px"
    "2xl":"20px"
    "3xl":"22px"
    "4xl":"28px"

  weight:
    regular:   400
    medium:    500
    semibold:  600
    bold:      700
    extrabold: 800

  line_height:
    tight:  1.4
    base:   1.6
    loose:  1.8

# ── Spacing ───────────────────────────────────────────────────────────────────
spacing:
  "1":   "4px"
  "2":   "8px"
  "3":   "12px"
  "4":   "14px"
  "5":   "16px"
  "6":   "18px"
  "7":   "20px"
  "8":   "22px"
  "9":   "24px"
  "10":  "28px"
  "12":  "32px"

# ── Border Radius ─────────────────────────────────────────────────────────────
radius:
  sm:   "6px"
  md:   "8px"
  lg:   "10px"
  xl:   "12px"
  pill: "999px"
  full: "50%"

# ── Shadows ───────────────────────────────────────────────────────────────────
shadow:
  sm:  "0 1px 2px rgba(0,0,0,0.05)"
  md:  "0 4px 6px -1px rgba(0,0,0,0.1)"
  lg:  "0 10px 15px -3px rgba(0,0,0,0.1)"
  xl:  "0 20px 25px -5px rgba(0,0,0,0.1)"

# ── Z-Index ───────────────────────────────────────────────────────────────────
z_index:
  base:    0
  card:    1
  sticky:  100
  modal:   200
  toast:   300

# ── Transitions ───────────────────────────────────────────────────────────────
transition:
  fast:    "0.15s ease"
  default: "0.2s ease"
  slow:    "0.35s ease"
  spring:  "0.3s cubic-bezier(0.34,1.56,0.64,1)"

# ── Gradients ─────────────────────────────────────────────────────────────────
gradient:
  navy_to_blue:    "linear-gradient(135deg, #1a3a52, #2d5a7b)"
  progress_fill:   "linear-gradient(90deg, #1a3a52, #2d5a7b)"
  mortgage_bg:     "linear-gradient(135deg, #f0f7ff, #e0f0ff)"
  insurance_bg:    "linear-gradient(135deg, #f0fdf4, #dcfce7)"