---
# ── Interactions & UI State Transitions ──────────────────────────────────────

# ── Screen Navigation ─────────────────────────────────────────────────────────
navigation:
  type: client_side_spa
  mechanism: show_hide_dom_sections
  trigger: nav_button_click | programmatic_call
  side_effects:
    - deactivate_all_screens
    - activate_target_screen
    - remove_active_class_from_all_nav_buttons
    - add_active_class_to_target_nav_button
    - scroll_to_top
  transition: instant    # no animation

# ── Documents Screen ──────────────────────────────────────────────────────────
toggle_upload_zone:
  trigger: button.upload_document | button.cancel
  state_key: documents.ui.upload_zone_open
  transitions:
    - from: false
      to:   true
      effect: show_element(#upload-zone)
    - from: true
      to:   false
      effect: hide_element(#upload-zone)

filter_tabs:
  trigger: tab_click
  state_key: documents.ui.active_filter
  effect:
    - update_active_tab_style
    - re_render_filtered_document_list
  values: [all, needs_signature, under_review, approved]

document_search:
  trigger: input_change(search_input)
  state_key: documents.ui.search_query
  debounce_ms: 200
  effect: filter_document_list

# ── Messages Screen ───────────────────────────────────────────────────────────
select_thread:
  trigger: thread_list_item_click
  state_key: messages.active_thread_id
  transitions:
    pre:
      - hide_all_chat_panels
    on_select:
      - show_chat_panel(thread.id)
      - mark_thread_as_read(thread.id)
      - remove_unread_dot(thread.id)
      - update_active_thread_style
    post:
      - scroll_chat_body_to_bottom

mark_as_read:
  trigger: thread_becomes_active
  state_mutation:
    thread.unread: false
  side_effects:
    - decrement_unread_badge_count

send_message:
  trigger: send_button_click | ctrl+enter
  preconditions:
    - compose_text.trim().length > 0
  steps:
    1: optimistic_append_message_to_ui
    2: clear_compose_textarea
    3: scroll_to_bottom
    4: call_api(POST /messages)
    5:
      on_failure:
        - remove_optimistic_message
        - show_error_toast("Failed to send message. Try again.")

compose_textarea_autoresize:
  trigger: textarea_input_event
  effect:
    - set height to "auto"
    - set height to min(scrollHeight, 110px)

# ── Mortgage Screen ───────────────────────────────────────────────────────────
save_employment:
  trigger: button_click(Save Employment Info)
  steps:
    1: validate_form(employment_form)
    2:
      on_invalid:
        show_inline_errors: true
    3:
      on_valid:
        - set_state(saving, true)
        - call_api(PATCH /mortgage/application/employment)
        - on_success:
          - update_section_status(employment_history, complete)
          - recalculate_progress_pct
          - show_toast(success, "Employment information saved.")
        - on_failure:
          - show_toast(error, "Save failed. Please try again.")
        - finally:
          - set_state(saving, false)

add_previous_employer:
  trigger: button_click("+ Add Previous Employer")
  effect: append_previous_employer_form_block

# ── Insurance Screen ──────────────────────────────────────────────────────────
save_insurance_form:
  trigger: form_submit (auto | home | warranty)
  steps:
    1: validate_form
    2: set_state(saving, true)
    3: call_api(PUT /insurance/{type})
    4:
      on_success:
        - update_insurance_status(type, complete)
        - show_toast(success, "Insurance information saved.")
        - emit_event(insurance_updated)
      on_failure:
        - show_toast(error, "Failed to save. Please try again.")
    5: set_state(saving, false)

# ── Global Interactions ───────────────────────────────────────────────────────
notification_bell:
  trigger: click
  effect: open_notifications_panel    # future feature

user_chip:
  trigger: click
  effect: open_user_menu              # future feature

upload_document:
  trigger: file_selected | drop_event
  steps:
    1: validate_file_type_and_size
    2:
      on_invalid: show_file_error(type_or_size)
    3:
      on_valid:
        - show_upload_progress_indicator
        - call_api(POST /documents/upload)
        - on_success:
          - append_document_to_list
          - show_toast(success, "Document uploaded successfully.")
          - emit_event(document_uploaded)
        - on_failure:
          - show_toast(error, "Upload failed. Please try again.")

sign_document:
  trigger: button_click(Sign Now)
  effect: open_esignature_flow(document_id)    # external or modal integration

view_document:
  trigger: button_click(View)
  effect: open_document_preview(document_id)

download_document:
  trigger: button_click(⬇ | Download)
  effect: trigger_browser_download(document_url)

# ── Animation Definitions ─────────────────────────────────────────────────────
animations:
  typing_dots:
    selector: ".t-dot"
    keyframe: tdot
    definition:
      "0%, 80%, 100%": { transform: "translateY(0)" }
      "40%":           { transform: "translateY(-4px)", background: "neutral.500" }
    duration:  "1.2s"
    timing:    infinite
    nth_child_delays:
      2: "0.2s"
      3: "0.4s"