---
# ── Screen: Messages ─────────────────────────────────────────────────────────
id: messages
route: "/messages"
title: "Messages"
layout: page_body

# ── Data Bindings ─────────────────────────────────────────────────────────────
data:
  threads:         "$store.messages.threads"
  active_thread:   "$store.messages.active_thread_id"
  messages:        "$store.messages.by_thread[active_thread]"
  current_user:    "$store.user"

# ── Local UI State ────────────────────────────────────────────────────────────
ui_state:
  thread_search:   ""
  compose_text:    ""
  is_typing:       false    # simulated for demo; real: websocket presence

# ── Computed ──────────────────────────────────────────────────────────────────
computed:
  filtered_threads: "threads.filter(t => t.participant.name.toLowerCase().includes(ui_state.thread_search.toLowerCase()))"
  active_messages:  "messages || []"
  active_contact:   "threads.find(t => t.id === active_thread)?.participant"

# ── Sections ──────────────────────────────────────────────────────────────────
sections:
  layout:
    component: MessagesLayout    # grid: sidebar + main
    ref: layout.messages_layout

    sidebar:
      header:
        component: SidebarHeader
        title: "Conversations"
        action:
          label: "+ New"
          variant: primary
          size: sm
          action: new_conversation

      search:
        component: SearchInput
        bind: "ui_state.thread_search"
        placeholder: "Search messages..."

      thread_list:
        component: ThreadList
        source: "computed.filtered_threads"
        active_id: "active_thread"
        on_select: select_thread
        per_item:
          avatar:    ThreadAvatar       # initials + role color
          name:      ThreadName
          role:      ThreadRole
          preview:   ThreadPreview      # truncated last message
          timestamp: ThreadTimestamp
          unread:    UnreadDot          # visible only when unread=true

    main:
      # Multiple chat panels rendered, only active one shown
      chat_panels:
        component: ChatPanel
        source: "threads"
        visible: "thread.id === active_thread"
        per_panel:

          header:
            component: ChatHeader
            props:
              avatar:    "thread.participant"
              name:      "thread.participant.name"
              role:      "thread.participant.role"
              status:    "thread.participant.online_status"
            actions:
              - label: "📋 Files"
                variant: ghost
                size: sm
                action: view_thread_files
              - label: "📞 Call"
                variant: ghost
                size: sm
                action: initiate_call
                condition: "thread.participant.role === 'agent'"

          messages_body:
            component: MessageBody
            source: "computed.active_messages"
            render_types:
              date_separator: DateSeparator
              announcement:   AnnouncementBanner
              message:        MessageBubble
              document_attachment: DocumentAttachment
              typing_indicator: TypingIndicator
            scroll: auto_bottom_on_new_message

          compose_bar:
            component: ComposeBar
            bind_text: "ui_state.compose_text"
            tools:
              - id: attach_file
                icon: "📎"
                action: attach_file
              - id: attach_image
                icon: "🖼️"
                action: attach_image
              - id: schedule
                icon: "📅"
                action: insert_date
            send_action: send_message
            send_trigger: ["button_click", "ctrl+enter"]

# ── Message Types ─────────────────────────────────────────────────────────────
message_variants:
  outbound:
    align: right
    bubble_bg: "brand.primary_navy"
    bubble_color: white
    border_radius: "13px 13px 4px 13px"
  inbound:
    align: left
    bubble_bg: white
    bubble_color: "neutral.800"
    border_color: "neutral.200"
    border_radius: "13px 13px 13px 4px"
    show_sender_name: true

# ── States ────────────────────────────────────────────────────────────────────
states:
  loading_threads:
    show: ThreadListSkeleton
    rows: 5
  loading_messages:
    show: MessageSkeleton
    rows: 6
  no_thread_selected:
    show: EmptyChat
    message: "Select a conversation to get started."
  empty_thread:
    condition: "computed.active_messages.length === 0"
    show: EmptyChat
    message: "No messages yet. Say hello!"