---
# ── Screen: Insurance ─────────────────────────────────────────────────────────
id: insurance
route: "/insurance"
title: "Insurance Information"
layout: page_body

# ── Data Bindings ─────────────────────────────────────────────────────────────
data:
  auto_insurance:    "$store.insurance.auto"
  home_insurance:    "$store.insurance.home"
  home_warranty:     "$store.insurance.warranty"
  documents:         "$store.insurance.documents"

# ── Local UI State ────────────────────────────────────────────────────────────
ui_state:
  auto_form:    "auto_insurance || {}"
  home_form:    "home_insurance || {}"
  warranty_form:"home_warranty || {}"
  saving:       false
  save_error:   null

# ── Sections ──────────────────────────────────────────────────────────────────
sections:

  info_alert:
    component: Alert
    variant: info
    props:
      icon: "ℹ️"
      title: "Insurance Details Required"
      body: "Please provide your insurance information below. This helps us coordinate your closing and ensure all requirements are met. Only basic information is needed — your insurance provider will handle the rest."

  insurance_cards:
    layout: grids.insurance_3col
    cards:

      auto_insurance:
        component: InsuranceFormCard
        title: "🚗 Auto Insurance"
        subtitle: "Vehicle coverage information"
        status_badge: "auto_insurance.status || 'not_started'"
        form_id: auto_form
        fields:
          - id: policyholder_name
            label: "Policyholder Name"
            type: text
            placeholder: "Full name as shown on policy"
            bind: "ui_state.auto_form.policyholder_name"
            required: true
          - id: date_of_birth
            label: "Date of Birth"
            type: date
            bind: "ui_state.auto_form.date_of_birth"
            required: true
          - id: vin
            label: "VIN Number"
            type: text
            placeholder: "17-character VIN"
            bind: "ui_state.auto_form.vin"
            max_length: 17
            transform: uppercase
            required: true
          - id: additional_info
            label: "Additional Information"
            type: textarea
            optional: true
            placeholder: "Policy number, insurance company, agent contact..."
            bind: "ui_state.auto_form.additional_info"
            rows: 2
        submit:
          label: "Save Auto Insurance"
          action: save_auto_insurance
          loading_label: "Saving..."

      home_insurance:
        component: InsuranceFormCard
        title: "🏠 Home Insurance"
        subtitle: "Property coverage information"
        status_badge: "home_insurance.status || 'not_started'"
        form_id: home_form
        fields:
          - id: policyholder_name
            label: "Policyholder Name"
            type: text
            placeholder: "Full name as shown on policy"
            bind: "ui_state.home_form.policyholder_name"
            required: true
          - id: date_of_birth
            label: "Date of Birth"
            type: date
            bind: "ui_state.home_form.date_of_birth"
            required: true
          - id: property_address
            label: "Property Address"
            type: text
            placeholder: "Address being insured"
            bind: "ui_state.home_form.property_address"
            required: true
          - id: additional_info
            label: "Additional Information"
            type: textarea
            optional: true
            placeholder: "Policy number, insurance company, agent contact..."
            bind: "ui_state.home_form.additional_info"
            rows: 2
        submit:
          label: "Update Home Insurance"
          variant: secondary
          action: save_home_insurance

      home_warranty:
        component: InsuranceFormCard
        title: "🔧 Home Warranty"
        subtitle: "Home systems & appliances"
        status_badge: "home_warranty.status || 'not_started'"
        form_id: warranty_form
        fields:
          - id: policyholder_name
            label: "Policyholder Name"
            type: text
            placeholder: "Full name as shown on policy"
            bind: "ui_state.warranty_form.policyholder_name"
            required: true
          - id: date_of_birth
            label: "Date of Birth"
            type: date
            bind: "ui_state.warranty_form.date_of_birth"
            required: true
          - id: property_address
            label: "Property Address"
            type: text
            placeholder: "Address covered by warranty"
            bind: "ui_state.warranty_form.property_address"
            required: true
          - id: additional_info
            label: "Additional Information"
            type: textarea
            optional: true
            placeholder: "Warranty company, coverage details, plan type..."
            bind: "ui_state.warranty_form.additional_info"
            rows: 2
        submit:
          label: "Save Home Warranty"
          action: save_home_warranty

  insurance_documents:
    component: DataTable
    title: "📎 Insurance Documents"
    header_action:
      label: "+ Upload Document"
      variant: primary
      size: sm
      action: upload_insurance_document
    source: "$store.insurance.documents"
    columns:
      - id: name
        label: "Document"
      - id: uploaded_by
        label: "Uploaded By"
      - id: date
        label: "Date"
      - id: status
        label: "Status"
        render: StatusBadge
      - id: actions
        label: "Actions"
        render: DocumentActionsCell
    empty_row_message: "Need to add more documents? Click \"Upload Document\" above."

# ── States ────────────────────────────────────────────────────────────────────
states:
  saving:
    disable_submit: true
    show_spinner: true
  save_error:
    show: InlineError
    bind: "ui_state.save_error"
  save_success:
    show: SuccessToast
    message: "Insurance information saved successfully."