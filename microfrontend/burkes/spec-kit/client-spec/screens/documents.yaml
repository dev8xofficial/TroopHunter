---
# ── Screen: Documents ─────────────────────────────────────────────────────────
id: documents
route: "/documents"
title: "Documents"
layout: page_body

# ── Data Bindings ─────────────────────────────────────────────────────────────
data:
  documents:       "$store.documents.all"
  categories:      "$store.documents.categories"

# ── Local UI State ────────────────────────────────────────────────────────────
ui_state:
  active_filter:   "all"             # all | needs_signature | under_review | approved
  search_query:    ""
  upload_zone_open: false

# ── Computed ──────────────────────────────────────────────────────────────────
computed:
  filtered_documents: >
    documents
      .filter(d => ui_state.active_filter === 'all' || d.status === ui_state.active_filter)
      .filter(d => d.name.toLowerCase().includes(ui_state.search_query.toLowerCase()))
  counts:
    all:              "documents.length"
    needs_signature:  "documents.filter(d=>d.status==='needs_signature').length"
    under_review:     "documents.filter(d=>d.status==='under_review').length"
    approved:         "documents.filter(d=>d.status==='approved').length"

# ── Sections ──────────────────────────────────────────────────────────────────
sections:

  permissions_legend:
    component: PermissionsLegend
    items:
      - label: "Real Estate Agent"
        role: agent
      - label: "Mortgage Lender"
        role: lender
      - label: "Attorney"
        role: attorney
      - label: "Client (You)"
        role: client
      - label: "CPA"
        role: cpa

  toolbar:
    layout: flex
    justify: space_between
    children:
      search:
        component: SearchInput
        placeholder: "Search documents..."
        bind: "ui_state.search_query"
      filter_tabs:
        component: FilterTabs
        bind: "ui_state.active_filter"
        tabs:
          - id: all
            label: "All"
            count: "computed.counts.all"
          - id: needs_signature
            label: "Needs Signature"
            count: "computed.counts.needs_signature"
          - id: under_review
            label: "Under Review"
            count: "computed.counts.under_review"
          - id: approved
            label: "Approved"
            count: "computed.counts.approved"
      upload_btn:
        component: Button
        variant: primary
        size: sm
        label: "📤 Upload Document"
        action: toggle_upload_zone

  upload_zone:
    component: UploadDropZone
    visible: "ui_state.upload_zone_open"
    props:
      accepted_types: ["application/pdf", "application/msword", "image/jpeg", "image/png"]
      max_size_mb: 25
      label: "Drop files here or browse"
    actions:
      on_upload: upload_document
      on_cancel:  toggle_upload_zone

  signature_alert:
    component: Alert
    variant: warning
    condition: "computed.counts.needs_signature > 0"
    props:
      icon: "✍️"
      title: "Signature Required"
      body: "Purchase Agreement & Buyer Disclosure Form require your signature before February 20, 2026."
    actions:
      - label: "Sign Documents"
        variant: primary
        action: open_signature_flow

  document_categories:
    component: DocumentCategorySection
    source: "$store.documents.categories"
    repeat: true
    per_category:
      header:
        component: CategoryHeader
        props:
          icon: "category.icon"
          title: "category.label"
          count: "category.documents.length"
      table:
        component: DocumentTable
        columns:
          - id: name
            label: "Document"
            render: DocumentNameCell      # icon + name + size
          - id: uploaded_by
            label: "Uploaded By"
            render: RoleCell              # role dot + label
          - id: date
            label: "Date"
            render: DateCell
          - id: status
            label: "Status"
            render: StatusBadge
          - id: actions
            label: "Actions"
            render: DocumentActionsCell
        row_actions:
          needs_signature:
            - label: "Sign Now"
              variant: primary
              action: sign_document
            - label: "View"
              variant: ghost
              action: view_document
          under_review:
            - label: "View"
              variant: ghost
              action: view_document
          approved:
            - label: "View"
              variant: ghost
              action: view_document
            - label: "⬇"
              variant: ghost
              action: download_document

  info_alert:
    component: Alert
    variant: info
    props:
      icon: "ℹ️"
      title: "Role-Based Document Access"
      body: "Your agent uploads purchase agreements, your lender shares mortgage documents, and your attorney reviews closing details. You can upload supporting personal documents at any time."

# ── States ────────────────────────────────────────────────────────────────────
states:
  loading:
    show: TableSkeleton
    rows: 5
  empty:
    condition: "computed.filtered_documents.length === 0"
    show: EmptyState
    message: "No documents match your filter."
  error:
    show: ErrorBanner
    message: "Failed to load documents."