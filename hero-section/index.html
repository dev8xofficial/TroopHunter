<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Burkes Group | Real Estate & Mortgage Experts</title>
    <meta name="description" content="The Burkes Group offers expert real estate and mortgage services for buyers, sellers, investors, and financial professionals. Built on trust, driven by legacy, delivered with reliability.">

    <!-- Open Graph -->
    <meta property="og:title" content="The Burkes Group | Real Estate & Mortgage Experts">
    <meta property="og:description" content="Expert real estate and mortgage services. Built on trust, driven by legacy, delivered with reliability.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.theburkesgrouptx.com/">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══ Page Inset Frame (Signature 15px gallery frame) ═══ -->
    <main class="page-frame">

        <!-- ═══ HERO SECTION ═══ -->
        <section class="hero" id="hero">

            <!-- Background Image with Ken Burns -->
            <div class="hero__bg">
                <img src="hero-bg.png" alt="Luxury modern residence at golden hour" fetchpriority="high">
            </div>

            <!-- Gradient Overlay -->
            <div class="hero__overlay"></div>

            <!-- Grain Texture Overlay -->
            <div class="hero__grain"></div>

            <!-- ─── Header / Navigation ─── -->
            <header class="header" id="header">
                <!-- Left: Navigation Links -->
                <nav class="header__nav" aria-label="Primary navigation">
                    <a href="#about" class="nav-item" id="nav-about">
                        <span class="nav-item__text">About Us</span>
                        <span class="nav-item__line"></span>
                    </a>
                    <a href="#buy" class="nav-item" id="nav-buy">
                        <span class="nav-item__text">Buy</span>
                        <span class="nav-item__line"></span>
                    </a>
                    <a href="#sell" class="nav-item" id="nav-sell">
                        <span class="nav-item__text">Sell</span>
                        <span class="nav-item__line"></span>
                    </a>
                    <a href="#services" class="nav-item" id="nav-services">
                        <span class="nav-item__text">Services</span>
                        <span class="nav-item__line"></span>
                    </a>
                </nav>

                <!-- Center: Logo -->
                <div class="header__logo">
                    <a href="/" class="logo" id="logo-main" aria-label="The Burkes Group - Home">
                        <span class="logo__mark">TBG</span>
                        <span class="logo__text">THE BURKES GROUP</span>
                        <span class="logo__tagline">REAL ESTATE &amp; MORTGAGE</span>
                    </a>
                </div>

                <!-- Right: CTA + Social -->
                <div class="header__actions">
                    <a href="#contact" class="btn btn--outline" id="cta-contact">
                        <span class="btn__text">Contact Us</span>
                        <div class="btn__fill"></div>
                    </a>
                    <a href="https://instagram.com" class="social-icon social-icon--desktop" id="social-instagram" aria-label="Follow us on Instagram" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-instagram"></i>
                        <div class="social-icon__fill"></div>
                    </a>
                    <!-- Mobile: Envelope replaces Instagram -->
                    <a href="mailto:jahcorrian@theburkesgrouptx.com" class="social-icon social-icon--mobile" id="social-email-mobile" aria-label="Email us">
                        <i class="far fa-envelope"></i>
                        <div class="social-icon__fill"></div>
                    </a>
                </div>

                <!-- Mobile Hamburger -->
                <button class="hamburger" id="hamburger-toggle" aria-label="Open navigation menu" aria-expanded="false">
                    <span class="hamburger__line"></span>
                    <span class="hamburger__line"></span>
                    <span class="hamburger__line"></span>
                </button>
            </header>

            <!-- ─── Mobile Menu Overlay ─── -->
            <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
                <button class="mobile-menu__close" id="mobile-menu-close" aria-label="Close navigation menu">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <line x1="4" y1="4" x2="20" y2="20"/>
                        <line x1="20" y1="4" x2="4" y2="20"/>
                    </svg>
                </button>
                <nav class="mobile-menu__nav">
                    <a href="#about" class="mobile-menu__link">About Us</a>
                    <a href="#buy" class="mobile-menu__link">Buy</a>
                    <a href="#sell" class="mobile-menu__link">Sell</a>
                    <a href="#services" class="mobile-menu__link">Services</a>
                    <a href="#blog" class="mobile-menu__link">Blog</a>
                    <a href="#contact" class="mobile-menu__link">Contact</a>
                </nav>
            </div>

            <!-- ─── Hero Content ─── -->
            <div class="hero__content">
                <!-- Title with line-by-line reveal animation -->
                <div class="hero__title-wrapper">
                    <div class="hero__title-line">
                        <div class="hero__title-mask">
                            <h1 class="hero__title" data-line="1">Built on Trust,</h1>
                        </div>
                    </div>
                    <div class="hero__title-line">
                        <div class="hero__title-mask">
                            <span class="hero__title hero__title--line2" data-line="2">Driven by Legacy.</span>
                        </div>
                    </div>
                </div>

                <!-- Descriptor Tags (like "Architectural • Crafted • Considered") -->
                <div class="hero__tags" id="hero-tags">
                    <span class="hero__tag">Strategic</span>
                    <span class="hero__tag-dot">•</span>
                    <span class="hero__tag">Trusted</span>
                    <span class="hero__tag-dot">•</span>
                    <span class="hero__tag">Results-Driven</span>
                </div>

                <!-- Subtitle -->
                <p class="hero__subtitle" id="hero-subtitle">
                    Real Estate &amp; Mortgage Experts — The Woodlands, TX
                </p>
            </div>

            <!-- ─── Scroll Indicator (Bottom-Left) ─── -->
            <div class="hero__scroll" id="hero-scroll">
                <!-- Mouse Icon with animated dot -->
                <div class="scroll-indicator">
                    <div class="scroll-indicator__mouse">
                        <div class="scroll-indicator__dot"></div>
                    </div>
                </div>

                <!-- Rolling Text on Hover -->
                <a href="#content" class="scroll-text" id="scroll-cta">
                    <div class="scroll-text__wrapper">
                        <span class="scroll-text__primary">Scroll to explore</span>
                        <span class="scroll-text__clone">Scroll to explore</span>
                        <div class="scroll-text__line"></div>
                    </div>
                </a>
            </div>

        </section>
        <!-- ═══ END HERO SECTION ═══ -->

    </main>

    <script src="script.js"></script>
</body>
</html>
