---
# ⚠ TEMPLATE ONLY. Never commit a filled-in copy of this file.
#
# Create the real Secret from the vault, e.g.:
#     kubectl create secret generic app-secrets -n default \
#       --from-literal=JWT_SECRET="$(read from vaultwarden: infrastructure/troophunter-jwt)"
#
# ⚠ JWT_SECRET IS ONE SHARED KEY. All five services must hold the SAME value or tokens minted
# by auth will not validate elsewhere. That is also why rotating it is a coordinated deploy
# and invalidates every live session — see README.md.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
stringData:
  JWT_SECRET: "FROM_VAULT_NEVER_COMMIT"
---
# auth only.
apiVersion: v1
kind: Secret
metadata:
  name: auth-mail-secret
  namespace: default
type: Opaque
stringData:
  # ⚠ A live credential that can SEND AS US. Treat a leak as a phishing capability, not just
  # a disclosure — rotate it at the mail provider, do not merely stop baking it.
  MAIL_PASS: "FROM_VAULT_NEVER_COMMIT"
