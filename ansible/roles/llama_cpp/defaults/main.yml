---
# ⚠ forge is authoritative for this role (Abdul, 2026-08-14).
# The maintained copy is `forge/infrastructure/implementation/ansible/roles/llama_cpp`.
# This copy is kept ONLY for work driven from the TroopHunter repo. Improve it here if you must,
# but the fleet is built from forge — and forge's version is already ahead of this one.
# Builds llama.cpp from source and runs llama-server as a systemd service.
# Settings here encode what we MEASURED (forge/infrastructure/reconciler/inference-economics.md):
#   - 64K context: Hermes refuses to start below 64,000
#   - flash attention on, parallel 1: measured best for a single agent
#   - reasoning OFF: an unbounded chain-of-thought at <5 tok/s is fatal
#   - single-box serving: RPC buys capacity, NOT speed (prefill stayed ~45 tok/s)

# cloud-init names the login user after the VM (ciuser = vm.name), so derive it
llama_user: "{{ ansible_user }}"
llama_home: /opt/llama.cpp
llama_repo: https://github.com/ggml-org/llama.cpp.git
# PIN the revision. `master` means every node gets whatever was current when it was
# built -> different ggml versions -> "Remote RPC server crashed or returned malformed
# response" the moment you try to split a model across them. Must match the RPC server's
# build (the Mac is at beac5309f / ggml 0.15.2).
llama_version: beac5309f

# Build: CPU-only (no GPU in these VMs). Fewer jobs than cores avoids OOM on 2GB/job.
llama_build_jobs: 4

# ---- model ----
llama_models_dir: /opt/models
llama_model_file: ""            # e.g. Ornith-1.0-35B-Q4_K_M.gguf  (REQUIRED)
llama_model_url: ""             # optional: fetched if the file is absent

# ---- serving (measured defaults) ----
llama_host: 0.0.0.0
llama_port: 8080
llama_ctx: 65536                # Hermes hard minimum
llama_threads: 8
llama_batch_threads: 8
llama_flash_attn: true
llama_parallel: 1
llama_reasoning: "off"          # never let a thinking model run unbounded here
llama_cache_type_k: q8_0
llama_cache_type_v: q8_0
llama_extra_args: ""
